<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CoolTaxTool — See what you keep.</title>
  <desc id="desc">UK take-home pay calculator. Green CoolTaxTool branding and an illustrative breakdown of take-home pay, pension, tax and National Insurance.</desc>
  <rect width="1200" height="630" fill="#f6f7f3"/>
  <g transform="translate(62 53) scale(1.3)">
    <g transform="rotate(-5 20 20)">
      <rect x="3.5" y="2.5" width="33" height="35" rx="10" fill="#226b53"/>
      <g fill="#fff">
        <rect x="11" y="21.5" width="4" height="7" rx="1"/>
        <rect x="18" y="16.5" width="4" height="12" rx="1"/>
        <rect x="25" y="11.5" width="4" height="17" rx="1"/>
      </g>
    </g>
  </g>
  <text x="128" y="91" font-family="Space Grotesk, sans-serif" font-size="36" font-weight="700" letter-spacing="-1.8" fill="#243c34">cooltax<tspan font-weight="500">tool</tspan><tspan fill="#72a178">.</tspan></text>
  <g font-family="IBM Plex Sans, sans-serif">
    <text x="66" y="183" font-size="19" font-weight="600" letter-spacing="2.6" fill="#226b53">UK TAKE-HOME PAY CALCULATOR</text>
    <text x="62" y="277" font-family="Space Grotesk, sans-serif" font-size="82" font-weight="500" letter-spacing="-4" fill="#243c34">See what</text>
    <text x="62" y="365" font-family="Space Grotesk, sans-serif" font-size="82" font-weight="500" letter-spacing="-4" fill="#226b53">you keep.</text>
    <text x="66" y="425" font-size="26" fill="#596b60">Understand your salary, tax and pension.</text>
    <text x="66" y="463" font-size="26" fill="#596b60">Make a plan for what’s next.</text>
    <path d="M66 522H624" stroke="#cbd5cc"/>
    <text x="66" y="569" font-size="23" font-weight="500" fill="#243c34">cooltaxtool.com</text>
    <text x="624" y="569" text-anchor="end" font-size="19" fill="#596b60">Free · Open source</text>
  </g>
  <rect x="690" y="52" width="448" height="526" rx="28" fill="#204d3b"/>
  <g font-family="IBM Plex Sans, sans-serif">
    <text x="730" y="107" font-size="18" font-weight="500" letter-spacing="2.4" fill="#c5dccb">YOUR PAY, EXPLAINED</text>
    <!-- Illustrative proportions, not a calculated salary scenario. -->
    <g transform="rotate(-90 914 284)" fill="none" stroke-width="42">
      <circle cx="914" cy="284" r="117" stroke="#365f4f"/>
      <circle cx="914" cy="284" r="117" pathLength="100" stroke="#b6d5a0" stroke-dasharray="65 35"/>
      <circle cx="914" cy="284" r="117" pathLength="100" stroke="#8cafa4" stroke-dasharray="12 88" stroke-dashoffset="-66"/>
      <circle cx="914" cy="284" r="117" pathLength="100" stroke="#e7bb78" stroke-dasharray="20 80" stroke-dashoffset="-79"/>
    </g>
    <text x="914" y="309" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="80" font-weight="500" fill="#fff">£</text>
    <circle cx="742" cy="456" r="7" fill="#b6d5a0"/>
    <text x="762" y="464" font-size="24" fill="#fff">Take-home pay</text>
    <circle cx="742" cy="495" r="7" fill="#8cafa4"/>
    <text x="762" y="503" font-size="24" fill="#fff">Pension</text>
    <circle cx="742" cy="534" r="7" fill="#e7bb78"/>
    <text x="762" y="542" font-size="24" fill="#fff">Tax &amp; National Insurance</text>
  </g>
</svg>
